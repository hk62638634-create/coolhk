name: Update map data

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC (11:00 Hong Kong time)
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    paths:
      - "scripts/build_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data from OpenStreetMap
        run: python scripts/build_data.py
      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update map data from OpenStreetMap" && git push)
