name: Update map data

# Manual only: nothing updates automatically.
# To refresh the data, open the Actions tab → Update map data → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data from OpenStreetMap
        run: python scripts/build_data.py
      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update map data from OpenStreetMap" && git push)
